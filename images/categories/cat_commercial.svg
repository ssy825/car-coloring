<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#12151c"/>
  <g transform="translate(90, 270) scale(0.82)">
    <!-- Outer Sticker White Contour -->
    <path d="M 60 480 L 60 210 Q 60 170 100 170 L 460 170 L 580 270 L 860 290 Q 910 300 910 360 L 910 480 Z"
          fill="none" stroke="#ffffff" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Semi Cab High Sleeper (Deep Royal Blue & Orange Accent) -->
    <path d="M 80 190 L 460 190 L 460 270 L 590 285 L 880 300 Q 900 310 900 370 L 900 480 L 780 480 A 100 100 0 0 0 580 480 L 440 480 A 100 100 0 0 0 240 480 L 80 480 Z"
          fill="#3182ce" stroke="#111" stroke-width="14" stroke-linejoin="round"/>

    <!-- Front Longnose Hood & Grille (Chrome & Orange) -->
    <path d="M 590 285 L 880 300 L 890 400 L 590 400 Z" fill="#dd6b20" stroke="#111" stroke-width="12"/>
    <rect x="850" y="320" width="45" height="130" rx="8" fill="#cbd5e0" stroke="#111" stroke-width="10"/>
    <rect x="865" y="420" width="30" height="30" rx="6" fill="#ecc94b" stroke="#111" stroke-width="6"/> <!-- Headlight -->

    <!-- Cab Windshield & Side Window -->
    <path d="M 460 210 L 575 285 L 460 285 Z" fill="#e2e8f0" stroke="#111" stroke-width="10"/>
    <rect x="320" y="210" width="120" height="75" rx="6" fill="#718096" stroke="#111" stroke-width="10"/>

    <!-- Chrome Exhaust Stacks (Tall Twin Pipes) -->
    <rect x="280" y="80" width="24" height="240" rx="8" fill="#e2e8f0" stroke="#111" stroke-width="10"/>
    <path d="M 280 80 L 260 60 L 284 60 Z" fill="#cbd5e0" stroke="#111" stroke-width="8"/>
    <rect x="310" y="90" width="20" height="230" rx="6" fill="#a0aec0" stroke="#111" stroke-width="8"/>

    <!-- Fuel Tank (Cylinder Chrome) -->
    <rect x="340" y="420" width="180" height="55" rx="14" fill="#cbd5e0" stroke="#111" stroke-width="10"/>
    <line x1="390" y1="420" x2="390" y2="475" stroke="#111" stroke-width="6"/>
    <line x1="470" y1="420" x2="470" y2="475" stroke="#111" stroke-width="6"/>

    <!-- Front Wheel -->
    <g transform="translate(710, 480)">
      <circle cx="0" cy="0" r="95" fill="#1a202c" stroke="#111" stroke-width="14"/>
      <circle cx="0" cy="0" r="55" fill="#e2e8f0" stroke="#111" stroke-width="10"/>
      <circle cx="0" cy="0" r="24" fill="#718096" stroke="#111" stroke-width="8"/>
      <!-- Lugs -->
      <circle cx="0" cy="-36" r="6" fill="#111"/>
      <circle cx="36" cy="0" r="6" fill="#111"/>
      <circle cx="0" cy="36" r="6" fill="#111"/>
      <circle cx="-36" cy="0" r="6" fill="#111"/>
    </g>

    <!-- Rear Wheels (Dual Tandem 1) -->
    <g transform="translate(340, 480)">
      <circle cx="0" cy="0" r="95" fill="#1a202c" stroke="#111" stroke-width="14"/>
      <circle cx="0" cy="0" r="55" fill="#e2e8f0" stroke="#111" stroke-width="10"/>
      <circle cx="0" cy="0" r="24" fill="#718096" stroke="#111" stroke-width="8"/>
    </g>

    <!-- Rear Wheels (Dual Tandem 2) -->
    <g transform="translate(150, 480)">
      <circle cx="0" cy="0" r="95" fill="#1a202c" stroke="#111" stroke-width="14"/>
      <circle cx="0" cy="0" r="55" fill="#e2e8f0" stroke="#111" stroke-width="10"/>
      <circle cx="0" cy="0" r="24" fill="#718096" stroke="#111" stroke-width="8"/>
    </g>
  </g>
</svg>
