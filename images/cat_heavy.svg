<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#12151c"/>
  <g transform="translate(100, 260) scale(0.8)">
    <!-- Outer Sticker White Contour -->
    <path d="M 60 540 L 60 420 L 160 420 L 180 200 Q 180 180 220 180 L 460 180 L 560 120 L 780 240 L 880 440 L 740 540 Z"
          fill="none" stroke="#ffffff" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Excavator Boom & Arm (Vibrant CAT Yellow) -->
    <!-- Boom (Main Arm) -->
    <path d="M 440 320 L 680 140 Q 720 130 750 160 L 780 240 L 520 400 Z" fill="#d69e2e" stroke="#111" stroke-width="14" stroke-linejoin="round"/>
    <!-- Hydraulic Cylinder 1 -->
    <path d="M 460 380 L 650 250" stroke="#e2e8f0" stroke-width="16" stroke-linecap="round"/>
    <path d="M 460 380 L 560 310" stroke="#1a202c" stroke-width="22" stroke-linecap="round"/>

    <!-- Stick (Secondary Arm) -->
    <path d="M 750 180 L 890 380 L 840 420 L 720 220 Z" fill="#ecc94b" stroke="#111" stroke-width="14" stroke-linejoin="round"/>
    <!-- Hydraulic Cylinder 2 -->
    <path d="M 700 160 L 830 310" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round"/>
    <path d="M 700 160 L 760 230" stroke="#1a202c" stroke-width="18" stroke-linecap="round"/>

    <!-- Bucket (Heavy Toothed Scoop) -->
    <path d="M 880 380 L 960 420 L 920 490 L 830 480 L 840 420 Z" fill="#2d3748" stroke="#111" stroke-width="14" stroke-linejoin="round"/>
    <!-- Bucket Teeth -->
    <polygon points="960,420 980,440 955,445" fill="#718096" stroke="#111" stroke-width="4"/>
    <polygon points="945,455 965,475 940,480" fill="#718096" stroke="#111" stroke-width="4"/>
    <polygon points="930,485 945,505 920,500" fill="#718096" stroke="#111" stroke-width="4"/>

    <!-- Cabin & Engine Body (Yellow & Glass) -->
    <!-- Body Counterweight Base -->
    <rect x="140" y="320" width="360" height="120" rx="14" fill="#ecc94b" stroke="#111" stroke-width="14"/>
    <rect x="120" y="300" width="120" height="140" rx="16" fill="#3182ce" stroke="#111" stroke-width="14"/> <!-- Counterweight -->

    <!-- Operator Glass Cabin -->
    <path d="M 280 200 L 440 200 Q 460 200 460 220 L 460 340 L 260 340 L 260 220 Q 260 200 280 200 Z"
          fill="#2d3748" stroke="#111" stroke-width="12"/>
    <rect x="280" y="215" width="70" height="105" rx="6" fill="#cbd5e0" stroke="#111" stroke-width="8"/>
    <rect x="365" y="215" width="75" height="105" rx="6" fill="#e2e8f0" stroke="#111" stroke-width="8"/>

    <!-- Revolving Turntable Base -->
    <rect x="220" y="440" width="220" height="30" rx="6" fill="#1a202c" stroke="#111" stroke-width="10"/>

    <!-- Crawler Undercarriage (Continuous Tracks) -->
    <rect x="80" y="470" width="500" height="100" rx="50" fill="#1a202c" stroke="#111" stroke-width="16"/>
    <!-- Track Treads -->
    <rect x="90" y="478" width="480" height="84" rx="42" fill="none" stroke="#4a5568" stroke-width="14" stroke-dasharray="24 16"/>

    <!-- Track Wheels (Drive Sprockets & Idlers) -->
    <circle cx="150" cy="520" r="34" fill="#e2e8f0" stroke="#111" stroke-width="10"/>
    <circle cx="250" cy="520" r="26" fill="#cbd5e0" stroke="#111" stroke-width="8"/>
    <circle cx="340" cy="520" r="26" fill="#cbd5e0" stroke="#111" stroke-width="8"/>
    <circle cx="430" cy="520" r="26" fill="#cbd5e0" stroke="#111" stroke-width="8"/>
    <circle cx="510" cy="520" r="34" fill="#e2e8f0" stroke="#111" stroke-width="10"/>
  </g>
</svg>
